# Minimal local stack for realtime-gateway — starts ONLY what this service needs.
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   pnpm dev
#
services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["./.dev-data/postgres:/var/lib/postgresql"]
    profiles: [db]   # skip postgres if service doesn't use it

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --memory
      - 256M
      - --overprovisioned
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - localhost:9092
    ports: ["127.0.0.1:9092:9092"]
