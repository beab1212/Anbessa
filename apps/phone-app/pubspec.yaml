name: ride_app_rider
description: Ride-app phone app — rider and driver modes in one app.
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  ride_app_core:
    path: ../../packages/core
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  socket_io_client: ^3.1.6
  flutter_map: ^8.3.2          # free OSM tile rendering, no API key required
  latlong2: ^0.10.1
  flutter_secure_storage: ^11.2.0
  geolocator: ^14.1.2          # driver mode: GPS for sending location pings

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
