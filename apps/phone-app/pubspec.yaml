name: phone_app
description: Anbessa phone app, rider and driver modes in one app.
publish_to: "none"
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  ride_app_core:
    path: ../../packages/core
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  dio: ^5.11.1
  socket_io_client: ^3.1.6     # realtime-gateway is Socket.io v4
  flutter_map: ^8.3.2          # raster tiles from the self-hosted tile stack (OSM fallback in dev)
  # vector maps with 2D/3D on Android and iOS (0.3.7 needs Flutter 3.47); flutter_map stays for Linux and tests
  maplibre: '>=0.3.6 <0.3.7'
  latlong2: ^0.10.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  geolocator: ^14.1.2          # driver mode: GPS every ~4 s, Android foreground service while online
  url_launcher: ^6.3.3         # payment pages (Custom Tabs), tel:, navigation
  package_info_plus: ^10.2.2   # the minimum-version gate
  intl: ^0.20.2
  firebase_core: ^5.1.0        # push; initialised only when FIREBASE_* defines are set
  firebase_messaging: ^17.0.1
  flutter_local_notifications: ^22.3.3
  image_picker: ^1.2.4         # driver documents
  crypto: ^3.0.7               # sha256 of uploads
  uuid: ^4.6.0                 # idempotency keys
  flutter_map_animations: ^0.11.0   # animated camera moves
  smooth_page_indicator: ^3.0.0     # intro carousel
  cached_network_image: ^3.4.1      # document thumbnails (4.x needs Dart 3.13)
  vibration: ^3.2.0                 # offer arrival pattern
  share_plus: ^13.3.0               # share a trip or receipt
  sensors_plus: ^7.1.0              # compass heading when the car is still
  confetti: ^0.8.0
  wakelock_plus: '>=1.7.0 <1.8.1'   # keep the screen on while navigating (1.8.1+ wants a dbus geolocator_linux can't use)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-Inter.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
    - family: NotoSansEthiopic
      fonts:
        - asset: assets/fonts/NotoSansEthiopic-Regular.ttf
        - asset: assets/fonts/NotoSansEthiopic-Bold.ttf
          weight: 700
