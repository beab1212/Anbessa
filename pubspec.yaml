# Dart pub workspace root for the Flutter side of the monorepo.
# `dart pub get` here resolves every package below in one lockfile.
name: ride_app_flutter
publish_to: "none"

environment:
  sdk: ^3.12.0

workspace:
  - apps/phone-app
  - packages/core

dev_dependencies:
  melos: ^8.9.0

melos:
  scripts:
    # generated sources that aren't committed (apps/phone-app localisations); flutter run/build/test
    # regenerate them on their own, flutter analyze doesn't
    gen:
      run: melos exec --file-exists=l10n.yaml -- flutter gen-l10n
    analyze:
      run: melos run gen && melos exec -- flutter analyze
    test:
      run: melos exec --dir-exists=test -- flutter test
