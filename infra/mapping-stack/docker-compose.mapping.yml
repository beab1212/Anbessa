# Self-hosted, free, open-source mapping stack — run separately from the main
# stack since Nominatim's import is heavy and region-specific. Most developers
# point at a shared staging instance of this rather than running it locally.

services:
  tileserver:
    image: maptiler/tileserver-gl:v5.7.0
    volumes: ["./data/tiles:/data"]
    ports: ["8081:8080"]

  nominatim:
    image: mediagis/nominatim:5.3
    environment:
      PBF_URL: https://download.geofabrik.de/africa/ethiopia-latest.osm.pbf
      REPLICATION_URL: https://download.geofabrik.de/africa/ethiopia-updates/
    volumes: ["./data/nominatim:/var/lib/postgresql/16/main"]
    ports: ["8080:8080"]
    shm_size: 1g

  osrm:
    image: osrm/osrm-backend:v5.25.0
    volumes: ["./data/osrm:/data"]
    command: osrm-routed --algorithm mld /data/region.osrm
    ports: ["5000:5000"]
