# Full local dev stack: core infra + every service. `docker compose up`
# brings up everything except the heavy mapping stack (see ../mapping-stack/),
# which most developers point at a shared staging instance instead of running
# locally, since Nominatim needs a large data import.

services:
  postgres:
    image: postgis/postgis:18-3.6-alpine
    environment:
      POSTGRES_USER: ride
      POSTGRES_PASSWORD: ride
      POSTGRES_DB: ride_app
    ports: ["5432:5432"]
    volumes: ["pg-data:/var/lib/postgresql"]

  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]

  redpanda:
    image: redpandadata/redpanda:v26.2.6
    command: ["redpanda", "start", "--smp", "1", "--memory", "512M", "--overprovisioned", "--kafka-addr", "0.0.0.0:9092", "--advertise-kafka-addr", "localhost:9092"]
    ports: ["9092:9092"]

  kong:
    image: kong:3.9
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
    volumes: ["../kong/kong.yml:/kong/kong.yml:ro"]
    ports: ["8000:8000"]
    depends_on: [auth-service, trip-service]

  auth-service:
    build: { context: ../.., dockerfile: services/auth-service/Dockerfile }
    env_file: ../../.env
    environment: { DATABASE_URL: postgresql://ride:ride@postgres:5432/ride_app }
    depends_on: [postgres, redpanda]
    ports: ["3001:3001"]

  trip-service:
    build: { context: ../.., dockerfile: services/trip-service/Dockerfile }
    env_file: ../../.env
    depends_on: [postgres, redis, redpanda]
    ports: ["3002:3002"]

  location-service:
    build: { context: ../.., dockerfile: services/location-service/Dockerfile }
    env_file: ../../.env
    depends_on: [redis, redpanda]
    ports: ["3003:3003"]

  pricing-service:
    build: { context: ../.., dockerfile: services/pricing-service/Dockerfile }
    env_file: ../../.env
    depends_on: [redis]
    ports: ["3004:3004"]

  payment-service:
    build: { context: ../.., dockerfile: services/payment-service/Dockerfile }
    env_file: ../../.env
    depends_on: [postgres, redis, redpanda]
    ports: ["3005:3005"]

  notification-service:
    build: { context: ../.., dockerfile: services/notification-service/Dockerfile }
    env_file: ../../.env
    depends_on: [redpanda]

  mapping-service:
    build: { context: ../.., dockerfile: services/mapping-service/Dockerfile }
    env_file: ../../.env
    ports: ["3007:3007"]

  fleet-service:
    build: { context: ../.., dockerfile: services/fleet-service/Dockerfile }
    env_file: ../../.env
    depends_on: [postgres, redis, redpanda]
    ports: ["3008:3008"]

  platform-service:
    build: { context: ../.., dockerfile: services/platform-service/Dockerfile }
    env_file: ../../.env
    depends_on: [postgres, redis, redpanda]
    ports: ["3011:3011"]

  audit-service:
    build: { context: ../.., dockerfile: services/audit-service/Dockerfile }
    env_file: ../../.env
    depends_on: [postgres, redpanda]
    ports: ["3010:3010"]

  realtime-gateway:
    build: { context: ../.., dockerfile: services/realtime-gateway/Dockerfile }
    env_file: ../../.env
    depends_on: [redis, redpanda]
    ports: ["3000:3000"]

volumes:
  pg-data:
