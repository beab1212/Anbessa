# Template deployment — copy per service, swap name/image/port/env.
# Shown here for trip-service as the example.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trip-service
  labels: { app: trip-service }
spec:
  replicas: 2
  selector:
    matchLabels: { app: trip-service }
  template:
    metadata:
      # tier: backend lets the NetworkPolicies (networkpolicy.yaml) allow service-to-service calls
      labels: { app: trip-service, tier: backend }
    spec:
      automountServiceAccountToken: false
      # Pod hardening. The image's `app` user has no fixed UID, so a numeric one is set here
      # (runAsNonRoot can only verify a numeric user); the image files are root-owned, read-only.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
      containers:
        - name: trip-service
          image: registry.example.com/ride-app/trip-service:latest
          ports: [{ containerPort: 3002 }]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          envFrom:
            - configMapRef: { name: trip-service-config }
            - secretRef: { name: trip-service-secrets }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 3002 }
            initialDelaySeconds: 15
            periodSeconds: 20
