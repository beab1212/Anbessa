# Kong in front of the services you run on your machine (`make dev-services`): `make dev-gateway`.
# It loads kong.dev.yml, which `make dev-gateway` generates from kong.yml (the routes and limits
# stay in one place) with every upstream pointed at host.docker.internal:<port>.
# Don't run it next to `make stack-up`: both want port 8000.
services:
  kong:
    image: kong:3.9
    container_name: anbessa-kong-dev
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /kong/kong.yml
      KONG_PROXY_LISTEN: "0.0.0.0:8000"
      # admin API, read-only use: curl localhost:8001/routes
      KONG_ADMIN_LISTEN: "0.0.0.0:8001"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
    volumes: ["./kong.dev.yml:/kong/kong.yml:ro"]
    ports: ["8000:8000", "127.0.0.1:8001:8001"]
    # Linux needs this for host.docker.internal; Docker Desktop has it already
    extra_hosts: ["host.docker.internal:host-gateway"]
