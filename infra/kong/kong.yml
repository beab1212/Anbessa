# Declarative Kong config (DB-less mode): routing, rate limiting and request
# size limits live here as config rather than code, so changing a route doesn't
# require redeploying a service.
#
# Kong does NOT verify JWTs (Auth.md AU5): every service verifies access tokens
# itself with libs/shared-authz against auth-service's JWKS, because Kong's
# open-source jwt plugin needs static per-consumer keys and can't follow key rotation.
# /internal/* routes are never exposed here.
_format_version: "3.0"

services:
  - name: auth-service
    url: http://auth-service:3001
    routes:
      # strip_path false: Better Auth and the identity API expect their full paths
      - name: app-auth-routes
        paths: ["/api/auth"]
        strip_path: false
      - name: admin-auth-routes
        paths: ["/api/admin-auth"]
        strip_path: false
      - name: identity-routes
        paths: ["/api/identity"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 60, policy: local }
      - name: request-size-limiting
        config: { allowed_payload_size: 64, size_unit: kilobytes }

  - name: notification-service
    url: http://notification-service:3006
    routes:
      - name: notification-device-routes
        paths: ["/api/notifications"]
        strip_path: false
      # Telegram Gateway delivery reports: no auth plugin, the HMAC signature is the
      # authentication (notification-service verifies it). /internal/* is never routed.
      - name: telegram-gateway-webhook
        paths: ["/api/webhooks/telegram-gateway"]
        methods: ["POST"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 120, policy: local }
      - name: request-size-limiting
        config: { allowed_payload_size: 16, size_unit: kilobytes }

  - name: mapping-service
    url: http://mapping-service:3007
    routes:
      # destination search, pickup labels and road snapping for the apps (JWT checked in the service)
      - name: maps-routes
        paths: ["/api/maps"]
        methods: ["GET"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 120, policy: local }

  - name: location-service
    url: http://location-service:3003
    routes:
      # ops map (staff) and the rider's trip view; /internal/* (matching) is never routed
      - name: location-routes
        paths: ["/api/locations"]
        methods: ["GET"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 120, policy: local }

  - name: trip-service
    url: http://trip-service:3002
    routes:
      - name: trip-routes
        paths: ["/api/trips"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 60, policy: local }

  - name: fleet-service
    url: http://fleet-service:3008
    routes:
      # drivers, vehicles, documents, sessions; /internal/* is never routed. Document files go
      # straight to S3 with pre-signed URLs, so no upload body passes through Kong.
      - name: fleet-routes
        paths: ["/api/fleet"]
        strip_path: false
    plugins:
      - name: rate-limiting
        config: { minute: 120, policy: local }

  - name: pricing-service
    url: http://pricing-service:3004
    routes:
      - name: pricing-routes
        paths: ["/api/pricing"]

  - name: payment-service
    url: http://payment-service:3005
    routes:
      - name: payment-routes
        paths: ["/api/payments"]
    plugins:
      - name: rate-limiting
        config: { minute: 20, policy: local }
