name: ride_app_core
description: Contracts and pure logic for the Anbessa phone app - API models mirrored from libs/shared-types, the typed API client, realtime event parsing, money/time/phone helpers, and the design system (theme and widgets). No Riverpod, no platform plugins.
publish_to: "none"
version: 1.0.0
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  intl: ^0.20.2
  crypto: ^3.0.7
  meta: ^1.16.0
  flutter_animate: ^4.5.2   # motion helpers (FadeSlideIn, Pulse)
  shimmer: ^4.0.0           # skeleton loading
  pinput: ^6.0.1            # OTP and trip PIN boxes (7.x is built on material_ui, not flutter/material)
  flutter_svg: ^2.3.0       # illustrations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/illustrations/
    - assets/vehicles/
    - assets/brand/
    - assets/fonts/OFL-Urbanist.txt
  # the body font (OFL). Use it as 'packages/ride_app_core/Urbanist' (anbessaFontFamily).
  fonts:
    - family: Urbanist
      fonts:
        - asset: assets/fonts/Urbanist-Regular.ttf
        - asset: assets/fonts/Urbanist-Medium.ttf
          weight: 500
        - asset: assets/fonts/Urbanist-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Urbanist-Bold.ttf
          weight: 700
        - asset: assets/fonts/Urbanist-ExtraBold.ttf
          weight: 800
